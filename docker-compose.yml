services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-gateway:0.10.1
    container_name: mcp-gateway
    ports:
      - "${MCP_PORT:-8080}:8080"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8080
      MCP_DATA_DIR: /data
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
      # Bootstrap master key: only used when the database has no keys yet.
      MCP_MASTER_KEY: ${MCP_MASTER_KEY:-}
      # Required for the encrypted secret vault.
      MCP_VAULT_SECRET: ${MCP_VAULT_SECRET:-}
      MCP_KEY_PEPPER: ${MCP_KEY_PEPPER:-}
      MCP_DELEGATION_MAX_DEPTH: ${MCP_DELEGATION_MAX_DEPTH:-3}
      MCP_GIT_IMPORT_ALLOWED_PREFIXES: ${MCP_GIT_IMPORT_ALLOWED_PREFIXES:-}
      MCP_TOOL_TIMEOUT_MS: ${MCP_TOOL_TIMEOUT_MS:-60000}
      # --- v0.9 computer use (Computer Broker) ---
      # Leave MCP_COMPUTER_BROKER_URL empty to keep the integration disabled.
      # Prefer saving the broker token in the console (encrypted vault) instead
      # of passing MCP_COMPUTER_BROKER_TOKEN here.
      MCP_COMPUTER_USE_ENABLED: ${MCP_COMPUTER_USE_ENABLED:-true}
      MCP_COMPUTER_BROKER_URL: ${MCP_COMPUTER_BROKER_URL:-}
      MCP_COMPUTER_BROKER_PUBLIC_URL: ${MCP_COMPUTER_BROKER_PUBLIC_URL:-}
      MCP_COMPUTER_BROKER_TOKEN: ${MCP_COMPUTER_BROKER_TOKEN:-}
      MCP_COMPUTER_BROKER_CA: ${MCP_COMPUTER_BROKER_CA:-}
    volumes:
      - ./data:/data
      # Optional: read-only CA bundle for a mkcert/self-signed broker cert.
      # Also set MCP_COMPUTER_BROKER_CA=/certs/broker-ca.pem and create ./certs.
      # - ./certs/broker-ca.pem:/certs/broker-ca.pem:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/mcp/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
