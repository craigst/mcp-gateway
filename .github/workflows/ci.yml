name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure git identity (test fixtures create repos)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit + integration + e2e)
        run: npm test

      - name: Test social watcher and supervisor
        run: npm run test:social

      - name: Build server + UI bundle
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mcp-gateway:ci

      - name: Smoke test image
        run: |
          docker run -d --name mcp-gateway-ci \
            -e MCP_MASTER_KEY="mcp_master_ci_bootstrap_key_0123456789abcdef" \
            -e MCP_VAULT_SECRET="ci-vault-secret-0123456789abcdef" \
            -p 18080:8080 mcp-gateway:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/mcp/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs mcp-gateway-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f mcp-gateway-ci || true

  managed-brain:
    name: managed brain integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: mcp_gateway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mcp_gateway_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test MCP adapter
        run: node services/brain/mcp/test/offline.mjs
      - name: Build managed brain image
        run: docker build -t mcp-gateway-managed-brain:ci services/brain
      - name: Wait for vector store
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6333/readyz; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Test against disposable database and vector store
        run: |
          docker run --rm --network host --tmpfs /work:rw,size=128m \
            -e BRAIN_DISPOSABLE_TEST=1 \
            -e BRAIN_API_KEY=synthetic-brain-key \
            -e BRAIN_PG_HOST=127.0.0.1 -e BRAIN_PG_USER=postgres \
            -e BRAIN_PG_DB=mcp_gateway_test -e BRAIN_PG_PASSWORD=synthetic-ci-password \
            -e QDRANT_HOST=127.0.0.1 -e DOCS_COLLECTION=mcp_gateway_test_docs \
            -e MEM0_COLLECTION=mcp_gateway_test_memories -e MEM0_EMBED_DIMS=768 \
            -e QDRANT_TIMEOUT=10 -e MEM0_TELEMETRY=false \
            --entrypoint python mcp-gateway-managed-brain:ci -m unittest discover -s tests -q
