name: Publish image

# Builds the gateway on GitHub and publishes it to the public GHCR package, so
# the image can be pulled and run anywhere instead of being built by hand on one
# machine. us-vps follows this package with mcp-gateway-update.timer.
#
# The tag is ALWAYS the version in package.json. A `v*` tag that disagrees with
# package.json fails the run rather than publishing a mislabelled image — see
# docs/VPS-DEPLOY.md "Image tag note".

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build · push · verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: **$VERSION**"

      - name: A v* tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag v$TAG does not match package.json version ${{ steps.version.outputs.version }}; bump package.json or retag."
            exit 1
          fi

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.version.outputs.short }}
          labels: |
            org.opencontainers.image.title=MCP Gateway
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the PUBLISHED artefact runs, not just the local build CI already
      # smokes. This is the image us-vps will actually pull.
      - name: Pull the published image and smoke test it
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker pull --platform linux/amd64 "$IMAGE"
          docker run -d --name gw-publish-smoke \
            -e MCP_MASTER_KEY="mcp_master_publish_smoke_0123456789abcdef" \
            -e MCP_VAULT_SECRET="publish-smoke-vault-secret-0123456789" \
            -p 18081:8080 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/mcp/v1/health; then
              echo "published image is healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs gw-publish-smoke
          exit 1

      - name: Report version the running image reports
        if: always()
        run: |
          docker run --rm "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" \
            node -p "require('/app/package.json').version" || true

      - name: Stop smoke container
        if: always()
        run: docker rm -f gw-publish-smoke || true

      - name: Summary
        run: |
          {
            echo "### Published ${{ steps.version.outputs.version }}"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.version.outputs.short }}"
            echo '```'
            echo ""
            echo "- platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "us-vps picks this up within 15 minutes (\`mcp-gateway-update.timer\`),"
            echo "or immediately with \`systemctl start mcp-gateway-update.service\`."
          } >> "$GITHUB_STEP_SUMMARY"
